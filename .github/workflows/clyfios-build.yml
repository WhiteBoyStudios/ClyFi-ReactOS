# ClyFiOS: 64-bit only builds.
#
# - build-msvc: the main build. MSVC amd64 Debug, DLL_EXPORT_VERSION 0x502 and
#   0x600. GCC-built amd64 currently dies at smss startup (ASSERT Heap != NULL
#   in RtlpInitializeHeap); official MSVC x64 builds boot fine.
#   MSVC Debug defaults to the WinDbg KD protocol on COM1 (binary, no kdb
#   prompt, assertions just bugcheck). We use the built-in kdb debugger
#   instead (_WINKD_=FALSE, KDBG=TRUE): readable serial log and a kdb:>
#   prompt on assertions, like the GCC builds.
# - build-gcc: kept (0x502 only) so the GCC-specific bug can be investigated.
#   Its symbols artifact holds binaries with DWARF info for addr2line.
# - release: on pushes to the clyfios branch, replaces the "latest-build"
#   GitHub Release with the MSVC ISOs, so the newest ISO is always at
#   https://github.com/WhiteBoyStudios/ClyFi-ReactOS/releases/latest
name: ClyFiOS Build
on:
  push:
    branches: [clyfios, 'clyfios-*']
  workflow_dispatch:

jobs:
  build-msvc:
    strategy:
      matrix:
        toolset: ['14']
        arch: [amd64]
        config: [Debug]
        dllver: ['0x502', '0x600']
      fail-fast: false
    runs-on: windows-latest
    steps:
    - name: Install ninja
      run: choco install -y ninja
    - name: Install Flex & Bison
      run: |
        curl -O https://svn.reactos.org/storage/vperevertkin/flexbison.7z || curl -OL https://web.archive.org/web/2025if_/https://svn.reactos.org/storage/vperevertkin/flexbison.7z
        7z x flexbison.7z -O${{github.workspace}}\bin
        echo "${{github.workspace}}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "BISON_PKGDATADIR=${{github.workspace}}\bin\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "M4=${{github.workspace}}\bin\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Activate VS cmd (amd64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        toolset: ${{matrix.toolset}}
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        path: src
    - name: Configure problem matchers
      run: echo ::add-matcher::src/.github/workflows/problem-matcher.json
    - name: Configure
      run: cmake -S src -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-msvc.cmake -DARCH:STRING=${{matrix.arch}} -DCMAKE_BUILD_TYPE=${{matrix.config}} -DDLL_EXPORT_VERSION=${{matrix.dllver}} -D_WINKD_=FALSE -DKDBG=TRUE
    - name: Build
      run: cmake --build build -- -k0
    - name: Generate ISO
      run: |
        cmake --build build --target bootcd
        Copy-Item build/bootcd.iso build/clyfios-${{matrix.arch}}-dbg-${{matrix.dllver}}.iso
    - name: Upload ISO
      uses: actions/upload-artifact@v7
      with:
        name: clyfios-msvc-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        path: build/clyfios-${{matrix.arch}}-dbg-${{matrix.dllver}}.iso
    - name: Upload debug symbols (PDB)
      uses: actions/upload-artifact@v7
      with:
        name: clyfios-msvc-symbols-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        path: build/msvc_pdb

  release:
    needs: build-msvc
    if: ${{ github.ref == 'refs/heads/clyfios' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Download MSVC ISOs
      run: |
        for v in 0x502 0x600; do
          gh run download ${{ github.run_id }} -n clyfios-msvc-amd64-Debug-$v-${{ github.sha }} -D iso
        done
        ls -la iso
    - name: Publish latest-build release
      run: |
        SHORT=$(echo ${{ github.sha }} | cut -c1-7)
        cat > notes.md <<EOF
        Newest ClyFiOS test build, from commit $SHORT on the clyfios branch.

        **Which file?**
        - \`clyfios-amd64-dbg-0x600.iso\` — the main ClyFiOS build (Vista-level APIs). Use this one.
        - \`clyfios-amd64-dbg-0x502.iso\` — ReactOS default settings, for comparison.

        **VirtualBox:** OS type Windows XP (64-bit), 3072 MB RAM, CD drive on the IDE controller.
        Boot **Live (Screen Debug)** to see debug output on screen.
        EOF
        gh release delete latest-build --yes --cleanup-tag || true
        gh release create latest-build iso/*.iso \
          --target ${{ github.sha }} \
          --title "ClyFiOS latest build ($SHORT)" \
          --notes-file notes.md \
          --latest

  build-gcc:
    strategy:
      matrix:
        compiler: [gcc]
        arch: [amd64]
        config: [Debug]
        dllver: ['0x502']
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
    - name: Get RosBE build specifics
      id: get_rosbe_spec
      run: |
        # Print actual cpu-type option only.
        echo -march = $(gcc -march=native -Q --help=target | grep "\-march=  " | awk '{print $NF}')
        # Take all options/text into account.
        echo march-sha=$(gcc -march=native -Q --help=target | sha1sum | awk '{print $1}') >> $GITHUB_OUTPUT
        echo git-sha=$(git ls-remote https://github.com/zefklop/RosBE.git | grep unix_amd64 | awk '{print $1}') >> $GITHUB_OUTPUT
        wget https://gist.githubusercontent.com/zefklop/b2d6a0b470c70183e93d5285a03f5899/raw/build_rosbe_ci.sh
        # Fallback for GNU file server problems.
        sed -i '/gcc-8.4.0\/gcc-8.4.0.tar.xz/c\wget https://ftpmirror.gnu.org/gcc/gcc-8.4.0/gcc-8.4.0.tar.xz || wget -L https://web.archive.org/web/2025if_/https://ftpmirror.gnu.org/gcc/gcc-8.4.0/gcc-8.4.0.tar.xz' ./build_rosbe_ci.sh
        # Fallback for SourceForge server problems.
        sed -i '/mingw-w64-v6.0.0.tar.bz2\/download/c\wget -O mingw-w64-v6.0.0.tar.bz2 https://sourceforge.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v6.0.0.tar.bz2/download && bzip2 -t mingw-w64-v6.0.0.tar.bz2 || (wget -O - https://github.com/mingw-w64/mingw-w64/archive/refs/tags/v6.0.0.tar.gz | tar -xz && mv mingw-w64-6.0.0 mingw-w64-v6.0.0 && tar -cjf mingw-w64-v6.0.0.tar.bz2 mingw-w64-v6.0.0 && rm -rf mingw-w64-v6.0.0)' ./build_rosbe_ci.sh
    - name: Get RosBE
      id: get_rosbe
      uses: actions/cache@v5
      with:
        path: RosBE-CI
        key: RosBE-CI-${{runner.os}}-${{steps.get_rosbe_spec.outputs.march-sha}}-${{steps.get_rosbe_spec.outputs.git-sha}}-${{hashfiles('./build_rosbe_ci.sh')}}
    - name: Compile RosBE
      if: ${{ steps.get_rosbe.outputs.cache-hit != 'true' }}
      run: |
        chmod +x build_rosbe_ci.sh
        ./build_rosbe_ci.sh ${{github.workspace}}/RosBE-CI
        test -x ${{github.workspace}}/RosBE-CI/RosBE.sh || { echo "::error::RosBE build failed. see download/build output a bit up"; exit 1; }
    - name: Install ccache
      run: sudo apt install ccache
    - name: Install LLVM
      if: ${{ matrix.compiler == 'clang' }}
      run: |
        export LLVM_VERSION=13
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh $LLVM_VERSION
        echo "D_CLANG_VERSION=-DCLANG_VERSION=$LLVM_VERSION" >> $GITHUB_ENV
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        path: src
    - name: Set up cache for ccache
      uses: actions/cache@v5
      with:
        path: ccache
        key: ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        restore-keys: |
          ccache-${{matrix.compiler}}-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-
    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV
    - name: Configure problem matchers
      run: echo ::add-matcher::src/.github/workflows/problem-matcher.json
    - name: Ease ccache compiler check (GCC)
      if: ${{ matrix.compiler == 'gcc' }}
      run: echo "CCACHE_COMPILERCHECK=string:${{steps.get_rosbe_spec.outputs.git-sha}}-${{hashfiles('./build_rosbe_ci.sh')}}" >> $GITHUB_ENV
    - name: Configure
      run: echo 'cmake -S ${{github.workspace}}/src -B ${{github.workspace}}/build -G Ninja -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-${{matrix.compiler}}.cmake -DARCH:STRING=${{matrix.arch}} -DCMAKE_BUILD_TYPE=${{matrix.config}} -DDLL_EXPORT_VERSION=${{matrix.dllver}} -DENABLE_CCACHE=1 ${{env.D_CLANG_VERSION}}' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}}
    # GCC and Clang use relative file paths for error messages, use sed to convert these to absolute paths so that GitHub could parse them
    - name: Build
      run: set -o pipefail && echo 'cmake --build ${{github.workspace}}/build -- -k0' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}} 2>&1 | sed 's|^\.\./src/|${{github.workspace}}/src/|'
    - name: Generate ISOs
      run: echo 'cmake --build ${{github.workspace}}/build --target bootcd livecd' | ${{github.workspace}}/RosBE-CI/RosBE.sh . 0 ${{matrix.arch}}
    - name: Print ccache statistics
      run: ccache -s
    - name: Upload ISO
      uses: actions/upload-artifact@v7
      with:
        name: clyfios-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        path: build/bootcd.iso
    - name: Upload symbols
      uses: actions/upload-artifact@v7
      with:
        name: clyfios-symbols-${{matrix.arch}}-${{matrix.config}}-${{matrix.dllver}}-${{github.sha}}
        if-no-files-found: warn
        path: |
          build/ntoskrnl/ntoskrnl.exe
          build/hal/halx86/hal*.dll
          build/dll/ntdll/ntdll.dll
          build/base/system/smss/smss.exe
          build/dll/win32/kernel32/kernel32.dll
          build/win32ss/win32k.sys
